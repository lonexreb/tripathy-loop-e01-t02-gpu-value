[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tripathy_loop_e01_t02_kalshi"
version = "0.1.0"
description = "Tripathy Loop E01 Track 02 Kalshi GPU forecasting research lane"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]
modal = ["modal>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tripathy_experiment"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tripathy_experiment"]
